name: tests

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    environment: Testing

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2
          coverage: xdebug

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm i

      - name: Add Flux Credentials Loaded From ENV
        run: composer config http-basic.composer.fluxui.dev "${{ secrets.FLUX_USERNAME }}" "${{ secrets.FLUX_LICENSE_KEY }}"

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Run Migrations (Prompt Gate)
        if: ${{ vars.ENFORCE_PROMPT_GATE == 'true' }}
        run: php artisan migrate --force

      - name: Import Required Prompts (Prompt Gate)
        if: ${{ vars.ENFORCE_PROMPT_GATE == 'true' }}
        env:
          REQUIRED_PROMPTS_JSON_BASE64: ${{ secrets.REQUIRED_PROMPTS_JSON_BASE64 }}
        run: |
          if [ -z "$REQUIRED_PROMPTS_JSON_BASE64" ]; then
            echo "REQUIRED_PROMPTS_JSON_BASE64 not set; skipping prompt import."
            exit 0
          fi
          echo "$REQUIRED_PROMPTS_JSON_BASE64" | base64 -d > /tmp/required-prompts.json
          php artisan analysis:import-required-prompts /tmp/required-prompts.json --system=1

      - name: Validate Required Process Prompts (Prompt Gate)
        if: ${{ vars.ENFORCE_PROMPT_GATE == 'true' }}
        run: php artisan analysis:check-required-prompts --system=1

      - name: Build Assets
        run: npm run build

      - name: Run Tests
        run: ./vendor/bin/pest