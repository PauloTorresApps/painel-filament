services:
  # Aplicação PHP-FPM
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    container_name: painel_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
      - ./docker-entrypoint.sh:/usr/local/bin/docker-entrypoint.sh:ro
      - laravel_bootstrap_cache:/var/www/html/bootstrap/cache
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-painel}
      - DB_USERNAME=${DB_USERNAME:-painel_user}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-painel-laravel}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://opentelemetry-collector:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      - OTEL_TRACES_EXPORTER=${OTEL_TRACES_EXPORTER:-otlp}
      - OTEL_METRICS_EXPORTER=${OTEL_METRICS_EXPORTER:-otlp}
      - OTEL_LOGS_EXPORTER=${OTEL_LOGS_EXPORTER:-otlp}
      - OTEL_PHP_AUTOLOAD_ENABLED=${OTEL_PHP_AUTOLOAD_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      opentelemetry-collector:
        condition: service_healthy
    networks:
      - painel_network

  # Node.js (build de assets frontend)
  node:
    image: node:22.22.0-alpine
    container_name: painel_node
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    command: sh -c "tail -f /dev/null"
    networks:
      - painel_network

  # Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: painel_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - app
    networks:
      - painel_network

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: painel_postgres
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-painel}
      POSTGRES_USER: ${DB_USERNAME:-painel_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - painel_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME:-painel_user} -d ${DB_DATABASE:-painel}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (Cache & Queue)
  redis:
    image: redis:7-alpine
    container_name: painel_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - painel_network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 3

  # MailHog (Email Testing)
  mailhog:
    image: mailhog/mailhog:latest
    container_name: painel_mailhog
    restart: unless-stopped
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_WEB_PORT:-8025}:8025"
    networks:
      - painel_network

  # Queue Worker (Supervisor)
  queue:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    container_name: painel_queue
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
      - ./docker/supervisor/supervisord.conf:/etc/supervisor/conf.d/supervisord.conf
      - ./docker-entrypoint.sh:/usr/local/bin/docker-entrypoint.sh:ro
      - laravel_bootstrap_cache:/var/www/html/bootstrap/cache
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-painel}
      - DB_USERNAME=${DB_USERNAME:-painel_user}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-painel-laravel}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://opentelemetry-collector:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      - OTEL_TRACES_EXPORTER=${OTEL_TRACES_EXPORTER:-otlp}
      - OTEL_METRICS_EXPORTER=${OTEL_METRICS_EXPORTER:-otlp}
      - OTEL_LOGS_EXPORTER=${OTEL_LOGS_EXPORTER:-otlp}
      - OTEL_PHP_AUTOLOAD_ENABLED=${OTEL_PHP_AUTOLOAD_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      opentelemetry-collector:
        condition: service_healthy
    command: /usr/bin/supervisord -c /etc/supervisor/conf.d/supervisord.conf
    networks:
      - painel_network

  opentelemetry-collector:
    hostname: opentelemetry-collector
    image: otel/opentelemetry-collector-contrib:0.140.0
    command: [ "--config=/etc/otel-collector-config.yml", "--feature-gates=pkg.translator.prometheus.NormalizeName" ]
    volumes:
      - ./otel-collector/otel-collector-config.yaml:/etc/otel-collector-config.yml
      - ./storage/logs:/var/log/laravel:ro
    restart: unless-stopped
    ports:
      - "8889:8889" # Prometheus exporter metrics
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver
    environment:
      - TEMPO_ENDPOINT=${TEMPO_ENDPOINT:-tempo:4317}
      - PROM_ENDPOINT=${PROM_ENDPOINT:-0.0.0.0:9090}
      - LOKI_ENDPOINT=${LOKI_ENDPOINT:-http://loki:3100/otlp}
      - LANGFUSE_OTLP_ENDPOINT=${LANGFUSE_OTLP_ENDPOINT:-http://host.docker.internal:3000/api/public/otel/v1/traces}
      - LANGFUSE_OTLP_BASIC_AUTH=${LANGFUSE_OTLP_BASIC_AUTH:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo-healthcheck:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "/otelcol-contrib", "--version" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - painel_network

  blackbox:
    image: prom/blackbox-exporter:v0.27.0
    container_name: blackbox
    restart: unless-stopped
    ports:
      - "9115:9115"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./blackbox/blackbox.yaml:/etc/blackbox/blackbox.yaml
    command: --config.file=/etc/blackbox/blackbox.yaml
    cap_add:
      - NET_RAW # Required for ICMP probes
    depends_on:
      - prometheus
      - tempo
      - loki
      - opentelemetry-collector
    networks:
      - painel_network
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9115/-/healthy" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  grafana:
    image: grafana/grafana:12.1.4
    ports:
      - '3000:3000'
    depends_on:
      - prometheus
      - loki
      - tempo
    volumes:
      - ./storage/grafana:/var/lib/grafana
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - ./grafana/provisioning:/etc/grafana/provisioning
      - /etc/localtime:/etc/localtime:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
      - GF_AUTH_ANONYMOUS_ENABLED=${GF_AUTH_ANONYMOUS_ENABLED:-false}
      - GF_AUTH_ANONYMOUS_ORG_ROLE=${GF_AUTH_ANONYMOUS_ORG_ROLE:-Viewer}
      - GF_AUTH_DISABLE_LOGIN_FORM=${GF_AUTH_DISABLE_LOGIN_FORM:-false}
      - GF_INSTALL_PLUGINS=${GF_INSTALL_PLUGINS:-https://storage.googleapis.com/integration-artifacts/grafana-exploretraces-app/grafana-exploretraces-app-latest.zip;grafana-traces-app}
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - painel_network

  prometheus:
    image: prom/prometheus:v3.7.3
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --web.enable-remote-write-receiver
      - --enable-feature=otlp-write-receiver
      - --enable-feature=exemplar-storage
      - --enable-feature=native-histograms
    volumes:
      - ./prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml
      - ./prometheus/alerts.yaml:/etc/prometheus/alerts.yaml
      - /etc/localtime:/etc/localtime:ro
      - ./storage/prometheus:/prometheus
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    ports:
      - "9090:9090"
    networks:
      - painel_network

  loki:
    image: grafana/loki:3.5.8
    container_name: loki
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./loki/loki-config.yaml:/etc/loki/local-config.yaml
      - ./storage/loki:/data/loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3100/ready" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - painel_network

  tempo:
    image: grafana/tempo:main-6fc8947
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./tempo/tempo-config.yaml:/etc/tempo.yaml
      - ./storage/tempo:/var/tempo
    ports:
      - 3200:3200 # tempo
      - 4317 # otlp grpc
    networks:
      - painel_network

  # Tempo healthcheck sidecar (since tempo image has no shell/curl/wget)
  tempo-healthcheck:
    image: curlimages/curl:8.11.1
    depends_on:
      - tempo
    command: >
      sh -c "
        until curl -f http://tempo:3200/ready; do
          echo 'Waiting for Tempo...';
          sleep 2;
        done;
        echo 'Tempo is ready!';
        tail -f /dev/null
      "
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://tempo:3200/ready" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - painel_network

  mcp-grafana:
    image: mcp/grafana@sha256:bd85b2644ea409ce8222088a20fd01b132047f3dcb85240bbce2b2030872a4f7
    container_name: mcp-grafana
    restart: unless-stopped
    # stdin_open: true
    # tty: false
    environment:
      - GRAFANA_URL=http://grafana:3000
    command: [ "-t", "streamable-http" ]
    ports:
      - "8001:8000"
    depends_on:
      grafana:
        condition: service_healthy
    networks:
      - painel_network

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "9100:9100"
    networks:
      - painel_network

  registry:
    image: registry:2
    container_name: registry
    restart: unless-stopped
    environment:
      - REGISTRY_HTTP_ADDR=0.0.0.0:5000
      - REGISTRY_HTTP_DEBUG_ADDR=0.0.0.0:5001
      - REGISTRY_HTTP_DEBUG_PROMETHEUS_ENABLED=true
      - REGISTRY_STORAGE_DELETE_ENABLED=true
    ports:
      - "5000:5000"
    volumes:
      - ./storage/registry:/var/lib/registry
    networks:
      - painel_network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    ports:
      - "8080:8080"
    networks:
      - painel_network

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: postgres-exporter
    restart: unless-stopped
    environment:
      - DATA_SOURCE_NAME=postgresql://${DB_USERNAME:-painel_user}:${DB_PASSWORD:-secret}@postgres:5432/${DB_DATABASE:-painel}?sslmode=disable
      - PG_EXPORTER_DISABLE_SETTINGS_METRICS=false
      - PG_EXPORTER_EXTEND_QUERY_PATH=
    depends_on:
      - postgres
    ports:
      - "9187:9187"
    networks:
      - painel_network

networks:
  painel_network:
    driver: bridge
volumes:
  laravel_bootstrap_cache:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local
  sail-mysql:
    driver: local
