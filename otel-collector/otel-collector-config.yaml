receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317  # Ensure it listens on all interfaces
      http:
        endpoint: 0.0.0.0:4318  # OTLP HTTP for SDKs configured with :4318

  filelog/laravel:
    include:
      - /var/log/laravel/laravel.log
    start_at: end
    include_file_path: true

exporters:

  otlp/tempo:
    endpoint: "${TEMPO_ENDPOINT}"
    tls:
      insecure: true
    timeout: 10s
    retry_on_failure:
      enabled: true

  otlphttp/loki:
    endpoint: "${LOKI_ENDPOINT}"
    tls:
      insecure: true
    timeout: 10s
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 10s
      max_elapsed_time: 60s
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 1000

  prometheus:
    endpoint: 0.0.0.0:8889
    send_timestamps: true

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64

  resource/laravel_logs:
    attributes:
      - key: service.name
        value: painel-laravel
        action: upsert
      - key: deployment.environment
        value: local
        action: upsert

  batch:
    send_batch_size: 512
    timeout: 5s

extensions:
  zpages:
     endpoint: 0.0.0.0:55679

  # Expose internal OTel Collector metrics for Prometheus scraping
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [zpages, health_check]  # Enable zpages and health check
  telemetry:
    metrics:
      level: detailed
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo]

    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]

    logs:
      receivers: [otlp, filelog/laravel]
      processors: [memory_limiter, resource/laravel_logs, batch]
      exporters: [otlphttp/loki]